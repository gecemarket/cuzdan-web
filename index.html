<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="theme-color" content="#121316">
</head>
<body class="bg-[#121316] text-[#E4E6EB] min-h-screen pb-28 font-sans antialiased select-none">

  <!-- Üst Başlık & Sekmeler -->
  <header class="p-4 bg-[#18191E] border-b border-[#24252B] sticky top-0 z-20 flex justify-between items-center">
    <div>
      <span class="text-xs text-slate-400">Genel Bakış</span>
      <h1 class="text-lg font-bold text-white flex items-center gap-1.5">
        Wallet Hesaplarım
      </h1>
    </div>
    <div id="sync-badge" class="text-[11px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20">
      ● Canlı
    </div>
  </header>

  <main class="max-w-md mx-auto p-3.5 space-y-4">

    <!-- 1. HESAP KARTLARI -->
    <div>
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-medium text-slate-400">Hesaplar</span>
        <button onclick="filterAccount(null)" class="text-xs text-sky-400 hover:underline">Tümünü seç</button>
      </div>
      <div id="accounts-grid" class="grid grid-cols-2 gap-2.5">
        <!-- JS ile dolacak -->
      </div>
    </div>

    <!-- 2. GİDER YAPISI (DONUT CHART) -->
    <div class="bg-[#1c1d24] p-4 rounded-3xl border border-[#282932]">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Gider yapısı</span>
        <span class="text-[11px] text-slate-500">SON 30 GÜN</span>
      </div>
      <div id="expense-total" class="text-2xl font-bold text-white mb-2">₺0,00</div>
      
      <div class="relative w-44 h-44 mx-auto my-2">
        <canvas id="expenseChart"></canvas>
      </div>

      <!-- Kategori Lejantı -->
      <div id="category-legend" class="flex flex-wrap gap-2 justify-center text-xs mt-3"></div>
    </div>

    <!-- 3. NAKİT AKIŞI BARI -->
    <div class="bg-[#1c1d24] p-4 rounded-3xl border border-[#282932] space-y-2">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
        <span>Nakit Akışı</span>
        <span id="cashflow-net" class="text-white font-bold">₺0,00</span>
      </div>
      <!-- Çubuk Bar -->
      <div class="h-3 w-full bg-[#282932] rounded-full overflow-hidden flex">
        <div id="income-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 50%"></div>
        <div id="expense-bar" class="bg-rose-500 h-full transition-all duration-500" style="width: 50%"></div>
      </div>
      <div class="flex justify-between text-xs pt-1">
        <span class="text-emerald-400">Gelir: <b id="income-total">₺0</b></span>
        <span class="text-rose-400">Gider: <b id="expense-total-label">₺0</b></span>
      </div>
    </div>

    <!-- 4. SON KAYITLAR LİSTESİ -->
    <div class="bg-[#1c1d24] p-4 rounded-3xl border border-[#282932]">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Son Kayıtlar</div>
      <div id="tx-list" class="space-y-3">
        <div class="text-center text-slate-500 py-6 text-xs">Kayıtlar yükleniyor...</div>
      </div>
    </div>

  </main>

  <!-- SAĞ ALTTA SABİT YUVARLAK '+' BUTONU -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-sky-500 hover:bg-sky-400 active:scale-90 text-white rounded-2xl shadow-xl flex items-center justify-center text-3xl font-light z-30 transition">
    +
  </button>

  <!-- İŞLEM EKLEME MODAL (AÇILIR PENCERE) -->
  <div id="tx-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1c1d24] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 border border-[#2d2e38] space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-white">Yeni Kayıt Ekle</h3>
        <button onclick="closeModal()" class="text-slate-400 text-xl font-bold px-2">&times;</button>
      </div>

      <!-- Tür Seçimi -->
      <div class="grid grid-cols-2 gap-2 bg-[#121316] p-1 rounded-2xl">
        <button id="modal-exp-btn" onclick="setModalType('expense')" class="py-2.5 rounded-xl font-semibold text-xs bg-rose-500 text-white">Gider</button>
        <button id="modal-inc-btn" onclick="setModalType('income')" class="py-2.5 rounded-xl font-semibold text-xs text-slate-400">Gelir</button>
      </div>

      <!-- Tutar -->
      <input id="modal-amount" type="number" step="0.01" inputmode="decimal" placeholder="₺0,00" class="w-full bg-[#121316] border border-[#2b2c37] rounded-2xl p-3.5 text-2xl font-bold text-white text-center focus:outline-none focus:border-sky-500">

      <!-- Hesap Seçimi -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Hesap</label>
        <select id="modal-account" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-3 text-sm text-white focus:outline-none"></select>
      </div>

      <!-- Ana Kategori -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Kategori</label>
        <select id="modal-category" onchange="updateSubCategories()" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-3 text-sm text-white focus:outline-none"></select>
      </div>

      <!-- Alt Kategori -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Alt Kategori</label>
        <select id="modal-subcategory" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-3 text-sm text-white focus:outline-none"></select>
      </div>

      <!-- Not -->
      <input id="modal-note" type="text" placeholder="Açıklama / Not..." class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-3 text-sm text-white focus:outline-none">

      <button id="modal-save-btn" onclick="submitModalTransaction()" class="w-full py-3.5 bg-sky-500 active:scale-95 text-white font-semibold rounded-xl text-sm transition">
        Kaydet
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
