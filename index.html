<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="theme-color" content="#121316">
</head>
<body class="bg-[#121316] text-[#E4E6EB] min-h-screen pb-28 font-sans select-none">

  <!-- Üst Başlık & Durum Çubuğu -->
  <header class="p-4 bg-[#18191E] border-b border-[#24252B] sticky top-0 z-20 flex justify-between items-center">
    <div>
      <span class="text-[11px] text-slate-400">Genel Bakış</span>
      <h1 class="text-base font-bold text-white">Wallet Hesaplarım</h1>
    </div>
    <div id="status-badge" class="text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">
      ⏳ Bağlanıyor...
    </div>
  </header>

  <!-- Uyarı / Bildirim Kutusu -->
  <div id="alert-box" class="hidden mx-4 mt-3 p-3 rounded-xl text-xs font-semibold"></div>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- HESAPLAR -->
    <div>
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Hesaplar</span>
        <button onclick="filterAccount(null)" class="text-xs text-sky-400 hover:underline">Tümünü seç</button>
      </div>
      <div id="accounts-grid" class="grid grid-cols-2 gap-2.5">
        <div class="p-3 bg-[#1c1d24] rounded-2xl border border-[#282932] text-xs text-slate-500">Yükleniyor...</div>
      </div>
    </div>

    <!-- NAKİT AKIŞI -->
    <div class="bg-[#1c1d24] p-4 rounded-3xl border border-[#282932] space-y-2">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
        <span>Nakit Akışı (Net)</span>
        <span id="cashflow-net" class="text-white font-bold text-sm">₺0,00</span>
      </div>
      <div class="h-2.5 w-full bg-[#282932] rounded-full overflow-hidden flex">
        <div id="income-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 50%"></div>
        <div id="expense-bar" class="bg-rose-500 h-full transition-all duration-300" style="width: 50%"></div>
      </div>
      <div class="flex justify-between text-xs pt-1">
        <span class="text-emerald-400 font-medium">Gelir: <b id="income-total">₺0,00</b></span>
        <span class="text-rose-400 font-medium">Gider: <b id="expense-total">₺0,00</b></span>
      </div>
    </div>

    <!-- SON HAREKETLER -->
    <div class="bg-[#1c1d24] p-4 rounded-3xl border border-[#282932]">
      <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Son Kayıtlar</div>
      <div id="tx-list" class="space-y-2.5">
        <div class="text-center text-slate-500 py-6 text-xs">Yükleniyor...</div>
      </div>
    </div>

  </main>

  <!-- SAĞ ALTTA SABİT '+' BUTONU -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-sky-500 hover:bg-sky-400 active:scale-90 text-white rounded-2xl shadow-2xl flex items-center justify-center text-3xl font-light z-30 transition cursor-pointer">
    +
  </button>

  <!-- İŞLEM EKLEME MODALI -->
  <div id="tx-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#1c1d24] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 border border-[#2d2e38] space-y-3.5">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-white">Yeni Kayıt</h3>
        <button onclick="closeModal()" class="text-slate-400 text-2xl font-bold px-2">&times;</button>
      </div>

      <!-- Tür Seçimi -->
      <div class="grid grid-cols-2 gap-2 bg-[#121316] p-1 rounded-xl">
        <button id="modal-exp-btn" type="button" onclick="setModalType('expense')" class="py-2 rounded-lg font-semibold text-xs bg-rose-500 text-white">Gider (-)</button>
        <button id="modal-inc-btn" type="button" onclick="setModalType('income')" class="py-2 rounded-lg font-semibold text-xs text-slate-400">Gelir (+)</button>
      </div>

      <!-- Tutar Girişi -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Tutar</label>
        <input id="modal-amount" type="number" step="0.01" inputmode="decimal" placeholder="0.00" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-3 text-xl font-bold text-white text-center focus:outline-none focus:border-sky-500">
      </div>

      <!-- Hesap Seçimi -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Hesap</label>
        <select id="modal-account" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-2.5 text-xs text-white focus:outline-none"></select>
      </div>

      <!-- Kategori Seçimi -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Kategori</label>
        <select id="modal-category" onchange="updateSubCategories()" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-2.5 text-xs text-white focus:outline-none"></select>
      </div>

      <!-- Alt Kategori -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Alt Kategori</label>
        <select id="modal-subcategory" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-2.5 text-xs text-white focus:outline-none"></select>
      </div>

      <!-- Not / Açıklama -->
      <div>
        <label class="text-[11px] text-slate-400 mb-1 block">Not (İsteğe bağlı)</label>
        <input id="modal-note" type="text" placeholder="Örn: Market harcaması" class="w-full bg-[#121316] border border-[#2b2c37] rounded-xl p-2.5 text-xs text-white focus:outline-none">
      </div>

      <button id="modal-save-btn" type="button" onclick="submitTransaction()" class="w-full py-3 bg-sky-500 hover:bg-sky-400 active:scale-95 text-white font-semibold rounded-xl text-xs transition shadow-lg mt-2">
        Kaydet
      </button>
    </div>
  </div>

  <script>
    // --- SUPABASE BAĞLANTISI ---
    const SUPABASE_URL = "https://ijmdrizpzfggmvnricde.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_hyJxzInEszidGUHRbPAJhg_apYW0_hu";

    let supabaseClient = null;
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      alert("Supabase başlatılamadı: " + e.message);
    }

    const CATEGORIES = {
      "Yiyecek & İçecek": { color: "#ea580c", icon: "🍴", subs: ["Yiyecek & İçecek", "Bar, kafe", "Market alışverişi", "Restoran, fast-food"] },
      "Alışveriş": { color: "#0284c7", icon: "🛍️", subs: ["Alışveriş", "Boş zaman", "Eczane, kozmetik", "Elektronik, aksesuar", "Ev, bahçe", "Hediyeler", "Kıyafet & ayakkabı"] },
      "Konut": { color: "#f97316", icon: "🏠", subs: ["Konut", "Bakım, onarım", "Kira", "Faturalar"] },
      "Ulaşım": { color: "#64748b", icon: "🚌", subs: ["Ulaşım", "Taksi", "Toplu taşıma", "Uzak mesafe"] },
      "Araç": { color: "#c026d3", icon: "🚗", subs: ["Araç", "Yakıt", "Bakım", "Otopark"] },
      "Yaşam & Eğlence": { color: "#84cc16", icon: "🎉", subs: ["Eğlence", "Tatil", "Abonelikler"] },
      "Yatırımlar": { color: "#ec4899", icon: "📈", subs: ["Yatırımlar", "Hisse", "Altın/Döviz"] },
      "Gelir": { color: "#eab308", icon: "💰", subs: ["Maaş", "Ek Gelir", "Hediye"] },
      "Diğer": { color: "#6b7280", icon: "📦", subs: ["Diğer"] }
    };

    let selectedAccountId = null;
    let currentModalType = 'expense';
    let localAccounts = [];

    function notify(text, isError = false) {
      const box = document.getElementById('alert-box');
      box.innerText = text;
      box.className = isError 
        ? "mx-4 mt-3 p-3 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30"
        : "mx-4 mt-3 p-3 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 5000);
    }

    async function loadData() {
      const badge = document.getElementById('status-badge');
      try {
        const { data: accounts, error: aErr } = await supabaseClient.from('accounts').select('*').order('created_at');
        if (aErr) throw aErr;
        localAccounts = accounts || [];

        const { data: txs, error: tErr } = await supabaseClient.from('transactions').select('*').order('created_at', { ascending: false });
        if (tErr) throw tErr;

        badge.innerHTML = "● Canlı Bağlı";
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium";

        renderAccounts(localAccounts);
        renderTransactions(txs || []);
      } catch (err) {
        badge.innerHTML = "✖ Hata!";
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium";
        notify("Veri Hatası: " + err.message, true);
      }
    }

    function renderAccounts(accounts) {
      const grid = document.getElementById('accounts-grid');
      grid.innerHTML = '';
      if (accounts.length === 0) {
        grid.innerHTML = '<div class="col-span-2 text-xs text-slate-500 py-3 text-center">Hesap yok.</div>';
        return;
      }
      accounts.forEach(acc => {
        const isSel = selectedAccountId === acc.id;
        const el = document.createElement('div');
        el.className = `p-3 rounded-2xl cursor-pointer border ${isSel ? 'border-sky-400 bg-[#232530]' : 'border-[#282932] bg-[#1c1d24]'}`;
        el.onclick = () => { selectedAccountId = (selectedAccountId === acc.id ? null : acc.id); loadData(); };
        el.innerHTML = `
          <div class="text-[11px] text-slate-400 font-medium">${acc.name}</div>
          <div class="text-sm font-bold text-white mt-0.5">
            ${acc.balance < 0 ? '-' : ''}₺${Math.abs(acc.balance || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2 })}
          </div>
        `;
        grid.appendChild(el);
      });

      const modalAcc = document.getElementById('modal-account');
      modalAcc.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    function renderTransactions(txs) {
      const filtered = selectedAccountId ? txs.filter(t => t.account_id === selectedAccountId) : txs;

      let exp = 0, inc = 0;
      filtered.forEach(t => {
        const v = parseFloat(t.amount) || 0;
        if (t.type === 'expense') exp += v; else inc += v;
      });

      const net = inc - exp;
      const netEl = document.getElementById('cashflow-net');
      netEl.innerText = (net < 0 ? '-' : '+') + '₺' + Math.abs(net).toLocaleString('tr-TR', { minimumFractionDigits: 2 });
      netEl.className = net < 0 ? 'text-rose-400 font-bold text-sm' : 'text-emerald-400 font-bold text-sm';

      document.getElementById('income-total').innerText = '₺' + inc.toLocaleString('tr-TR', { minimumFractionDigits: 2 });
      document.getElementById('expense-total').innerText = '₺' + exp.toLocaleString('tr-TR', { minimumFractionDigits: 2 });

      const tot = inc + exp;
      document.getElementById('income-bar').style.width = (tot > 0 ? (inc/tot)*100 : 50) + '%';
      document.getElementById('expense-bar').style.width = (tot > 0 ? (exp/tot)*100 : 50) + '%';

      const list = document.getElementById('tx-list');
      list.innerHTML = '';
      if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center text-slate-500 py-6 text-xs">Henüz işlem yok.</div>';
        return;
      }

      filtered.slice(0, 15).forEach(t => {
        const isExp = t.type === 'expense';
        const cat = CATEGORIES[t.category] || { icon: '📦', color: '#64748b' };
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-2.5 rounded-xl bg-[#15161b] border border-[#24252f]';
        row.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="text-lg">${cat.icon}</span>
            <div>
              <div class="text-xs font-semibold text-white">${t.sub_category || t.category}</div>
              <div class="text-[10px] text-slate-400">${t.note || t.category}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-bold ${isExp ? 'text-rose-400' : 'text-emerald-400'}">
              ${isExp ? '-' : '+'}₺${parseFloat(t.amount).toLocaleString('tr-TR', { minimumFractionDigits: 2 })}
            </div>
            <button onclick="deleteTx('${t.id}')" class="text-[10px] text-slate-500 hover:text-rose-400">Sil</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function openModal() {
      document.getElementById('tx-modal').classList.remove('hidden');
      const catSelect = document.getElementById('modal-category');
      catSelect.innerHTML = Object.keys(CATEGORIES).map(c => `<option value="${c}">${CATEGORIES[c].icon} ${c}</option>`).join('');
      updateSubCategories();
    }

    function closeModal() {
      document.getElementById('tx-modal').classList.add('hidden');
    }

    function setModalType(type) {
      currentModalType = type;
      const exp = document.getElementById('modal-exp-btn');
      const inc = document.getElementById('modal-inc-btn');
      if (type === 'expense') {
        exp.className = 'py-2 rounded-lg font-semibold text-xs bg-rose-500 text-white';
        inc.className = 'py-2 rounded-lg font-semibold text-xs text-slate-400';
      } else {
        inc.className = 'py-2 rounded-lg font-semibold text-xs bg-emerald-500 text-white';
        exp.className = 'py-2 rounded-lg font-semibold text-xs text-slate-400';
      }
    }

    function updateSubCategories() {
      const cat = document.getElementById('modal-category').value;
      const subSelect = document.getElementById('modal-subcategory');
      const subs = CATEGORIES[cat]?.subs || [cat];
      subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    async function submitTransaction() {
      const amtInput = document.getElementById('modal-amount');
      const amt = parseFloat(amtInput.value);
      if (!amt || amt <= 0) {
        alert('Lütfen geçerli bir tutar yazın!');
        return;
      }

      const accountId = document.getElementById('modal-account').value;
      if (!accountId) {
        alert('Hesap bulunamadı! Önce Supabase SQL alanında hesap oluşturulmalı.');
        return;
      }

      const category = document.getElementById('modal-category').value;
      const subCategory = document.getElementById('modal-subcategory').value;
      const note = document.getElementById('modal-note').value;

      const btn = document.getElementById('modal-save-btn');
      btn.innerText = 'Kaydediliyor...';
      btn.disabled = true;

      try {
        const { error: insErr } = await supabaseClient.from('transactions').insert([{
          account_id: accountId,
          type: currentModalType,
          amount: amt,
          category: category,
          sub_category: subCategory,
          note: note
        }]);
        if (insErr) throw insErr;

        // Bakiye güncelleme
        const acc = localAccounts.find(a => a.id === accountId);
        if (acc) {
          const newBal = currentModalType === 'expense' ? (parseFloat(acc.balance) - amt) : (parseFloat(acc.balance) + amt);
          await supabaseClient.from('accounts').update({ balance: newBal }).eq('id', accountId);
        }

        notify('İşlem başarıyla eklendi!');
        amtInput.value = '';
        document.getElementById('modal-note').value = '';
        closeModal();
        loadData();
      } catch (err) {
        alert('HATA: ' + err.message);
      } finally {
        btn.innerText = 'Kaydet';
        btn.disabled = false;
      }
    }

    async function deleteTx(id) {
      if (confirm('İşlemi silmek istiyor musunuz?')) {
        await supabaseClient.from('transactions').delete().eq('id', id);
        notify('Kayıt silindi.');
        loadData();
      }
    }

    // Realtime Dinleme
    try {
      supabaseClient.channel('realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => loadData())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, () => loadData())
        .subscribe();
    } catch(e){}

    loadData();
  </script>
</body>
</html>
