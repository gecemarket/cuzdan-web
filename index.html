<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kişisel Cüzdan</title>
  <!-- Stil ve Kütüphaneler -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Mobil uygulama görünümü -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans select-none">

  <!-- Üst Başlık -->
  <header class="p-4 bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
      <span>💳</span> Cüzdanım
    </h1>
    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1.5 font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Canlı Eşitleme
    </span>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Toplam Bakiye Kartı -->
    <div class="bg-gradient-to-br from-indigo-600 to-violet-700 p-5 rounded-3xl shadow-xl border border-indigo-400/20">
      <div class="text-xs text-indigo-200 uppercase tracking-wider font-semibold">Net Bakiye</div>
      <div id="total-balance" class="text-3xl font-extrabold mt-1 tracking-tight">₺0,00</div>
    </div>

    <!-- Yeni İşlem Kartı -->
    <div class="bg-slate-800 p-4 rounded-3xl border border-slate-700 space-y-3 shadow-md">
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Yeni İşlem</div>
      
      <!-- Gelir / Gider Butonları -->
      <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-1 rounded-2xl border border-slate-700/50">
        <button id="type-expense" type="button" class="py-2 text-sm font-semibold rounded-xl bg-rose-500 text-white transition active:scale-95 shadow" onclick="setType('expense')">Gider (-)</button>
        <button id="type-income" type="button" class="py-2 text-sm font-semibold rounded-xl text-slate-400 transition active:scale-95" onclick="setType('income')">Gelir (+)</button>
      </div>

      <div class="space-y-2">
        <input id="amount" type="number" step="0.01" inputmode="decimal" placeholder="Tutar (₺)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-lg font-semibold placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        
        <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
          <option value="Market">🛒 Market / Mutfak</option>
          <option value="Ulaşım">🚗 Ulaşım / Akaryakıt</option>
          <option value="Fatura">💡 Fatura / Abonelik</option>
          <option value="Yeme-İçme">☕ Kafe / Restoran</option>
          <option value="Maaş">💰 Maaş / Ek Gelir</option>
          <option value="Sağlık">💊 Sağlık / Bakım</option>
          <option value="Diğer">📦 Diğer</option>
        </select>

        <input id="note" type="text" placeholder="Açıklama (Örn: Haftalık alışveriş)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-indigo-500">
      </div>

      <button id="save-btn" onclick="saveTransaction()" class="w-full py-3.5 bg-indigo-500 hover:bg-indigo-600 active:scale-95 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-500/25">Kaydet</button>
    </div>

    <!-- Son Hareketler -->
    <div>
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 px-1">Son Hareketler</div>
      <div id="tx-list" class="space-y-2">
        <div class="text-center text-slate-500 py-6 text-sm">Yükleniyor...</div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
