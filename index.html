<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wallet by BudgetBakers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #EDF1F7; }
    .gauge-bg { stroke: #E2E8F0; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-16">

  <!-- 1. ÜST NAVİGASYON (NAVBAR) -->
  <header class="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-xs">
    <div class="flex items-center space-x-6 overflow-x-auto py-1">
      <div class="flex items-center space-x-2 shrink-0 pr-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-white font-black text-lg shadow-sm">
          W
        </div>
        <span class="font-bold text-slate-800 text-sm hidden md:inline">Wallet</span>
      </div>

      <nav class="flex items-center space-x-1.5 shrink-0 text-[13px] font-medium text-slate-600">
        <button class="px-3.5 py-1.5 rounded-full bg-slate-100 text-slate-900 font-semibold border border-slate-200 shadow-xs">Kontrol Paneli</button>
        <button class="px-3 py-1.5 rounded-full hover:bg-slate-50 transition">Hesaplar</button>
        <button class="px-3 py-1.5 rounded-full hover:bg-slate-50 transition">Kayıtlar</button>
        <button class="px-3 py-1.5 rounded-full hover:bg-slate-50 transition">Analitik</button>
        <button class="px-3 py-1.5 rounded-full hover:bg-slate-50 transition hidden sm:inline">Yatırımlar</button>
        <button class="px-3 py-1.5 rounded-full hover:bg-slate-50 transition hidden sm:inline">İçe Aktarılanlar</button>
      </nav>
    </div>

    <div class="flex items-center space-x-3 shrink-0">
      <span id="sync-badge" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200">
        ● Canlı
      </span>
      <button onclick="openModal()" class="bg-[#2EB85C] hover:bg-[#28A745] active:scale-95 text-white font-medium text-[13px] px-4 py-1.5 rounded-md shadow-xs transition flex items-center space-x-1 cursor-pointer">
        <span class="text-base font-bold leading-none">+</span>
        <span>Kayıt</span>
      </button>
    </div>
  </header>

  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-5 space-y-4">

    <!-- 2. HESAP KARTLARI BARI -->
    <div class="flex items-center space-x-3 overflow-x-auto pb-2 scrollbar-none">
      <div id="accounts-container" class="flex items-center space-x-3 shrink-0"></div>
      <button onclick="addAccountPrompt()" class="shrink-0 h-[62px] px-5 rounded-lg border border-dashed border-slate-300 hover:border-slate-400 text-slate-500 hover:text-slate-700 text-xs font-semibold flex items-center space-x-1 transition bg-white/50 cursor-pointer">
        <span class="text-base font-bold">+</span>
        <span>Hesap Ekle</span>
      </button>
    </div>

    <!-- 3. TARİH SEÇİCİ -->
    <div class="flex justify-center items-center py-1">
      <div class="bg-white border border-slate-200 shadow-2xs rounded-full px-4 py-1 flex items-center space-x-4 text-xs font-semibold text-slate-700">
        <button class="text-slate-400 hover:text-slate-700 px-1">&lt;</button>
        <span>Bu ay</span>
        <button class="text-slate-400 hover:text-slate-700 px-1">&gt;</button>
      </div>
    </div>

    <!-- 4. ANA DASHBOARD WIDGETLARI -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <!-- KONTROL PANELİ İBRELERİ -->
      <div class="bg-white rounded-xl border border-slate-200/90 shadow-2xs p-5 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-bold text-slate-600 tracking-wider">Kontrol Paneli</h2>
          <div class="text-slate-400 text-xs flex space-x-2">
            <span>🎛</span><span>🗑</span>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center py-4">
          <div class="flex flex-col items-center">
            <svg class="w-16 h-12" viewBox="0 0 100 60">
              <path class="gauge-bg" d="M10,50 A40,40 0 0,1 90,50" fill="none" stroke-width="8" stroke-linecap="round"/>
              <path d="M10,50 A40,40 0 0,1 40,15" fill="none" stroke="#EA4335" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] font-bold text-slate-400 mt-1 uppercase">Bakiye</span>
            <span id="gauge-bal" class="text-xs font-bold text-slate-700 mt-0.5">₺0</span>
          </div>
          <div class="flex flex-col items-center">
            <svg class="w-16 h-12" viewBox="0 0 100 60">
              <path class="gauge-bg" d="M10,50 A40,40 0 0,1 90,50" fill="none" stroke-width="8" stroke-linecap="round"/>
              <path d="M10,50 A40,40 0 0,1 70,22" fill="none" stroke="#2EB85C" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] font-bold text-slate-400 mt-1 uppercase">Nakit Akış</span>
            <span id="gauge-flow" class="text-xs font-bold text-slate-700 mt-0.5">₺0</span>
          </div>
          <div class="flex flex-col items-center">
            <svg class="w-16 h-12" viewBox="0 0 100 60">
              <path class="gauge-bg" d="M10,50 A40,40 0 0,1 90,50" fill="none" stroke-width="8" stroke-linecap="round"/>
              <path d="M10,50 A40,40 0 0,1 55,11" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <span class="text-[10px] font-bold text-slate-400 mt-1 uppercase">Harcama</span>
            <span id="gauge-exp" class="text-xs font-bold text-slate-700 mt-0.5">₺0</span>
          </div>
        </div>

        <div class="border-t border-slate-100 pt-3 text-center">
          <span class="text-[11px] text-slate-400 font-medium">Bu dönem verileri</span>
        </div>
      </div>

      <!-- BAKİYE EĞİLİMİ -->
      <div class="bg-white rounded-xl border border-slate-200/90 shadow-2xs p-5">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-xs font-bold text-slate-600 tracking-wider">Bakiye Eğilimi</h2>
          <div class="text-slate-400 text-xs flex space-x-2">
            <span>⚙️</span><span>🗑</span>
          </div>
        </div>
        <div class="flex justify-between items-baseline mb-2">
          <div>
            <span class="text-[10px] text-slate-400 block font-medium">Bu ay</span>
            <span id="trend-total" class="text-lg font-bold text-slate-800 tracking-tight">₺0,00</span>
          </div>
          <span class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
            Önceki Döneme Karşı <b class="text-slate-500">⊖ 0%</b>
          </span>
        </div>

        <div class="h-32 w-full mt-2">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- GİDER YAPISI -->
      <div class="bg-white rounded-xl border border-slate-200/90 shadow-2xs p-5 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-xs font-bold text-slate-600 tracking-wider">Gider Yapısı</h2>
          <div class="text-slate-400 text-xs flex space-x-2">
            <span>⚙️</span><span>🗑</span>
          </div>
        </div>

        <div id="expense-empty" class="text-center py-10 text-slate-400 text-xs">
          Seçili zaman aralığında kayıtlı veri yok.
        </div>

        <div id="expense-chart-box" class="hidden relative w-36 h-36 mx-auto my-2">
          <canvas id="donutChart"></canvas>
        </div>

        <div id="expense-legend" class="text-[11px] text-slate-500 flex flex-wrap gap-2 justify-center mt-2"></div>
      </div>

    </div>

    <!-- 5. SON İŞLEMLER LİSTESİ -->
    <div class="bg-white rounded-xl border border-slate-200/90 shadow-2xs p-5">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xs font-bold text-slate-600 tracking-wider uppercase">Son Kayıtlar Genel Bakış</h2>
        <span class="text-xs text-slate-400">Son 30 Gün</span>
      </div>
      <div id="tx-table" class="divide-y divide-slate-100">
        <div class="text-center py-6 text-xs text-slate-400">Yükleniyor...</div>
      </div>
    </div>

  </div>

  <!-- KAYIT EKLEME MODAL PENCERESİ -->
  <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-sm text-slate-800">+ Yeni Kayıt Ekle</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
      </div>

      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg">
        <button id="btn-exp" type="button" onclick="setType('expense')" class="py-2 text-xs font-bold rounded-md bg-rose-500 text-white shadow-xs">Gider</button>
        <button id="btn-inc" type="button" onclick="setType('income')" class="py-2 text-xs font-bold rounded-md text-slate-600">Gelir</button>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Tutar (₺)</label>
        <input id="input-amount" type="number" step="0.01" inputmode="decimal" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xl font-bold text-slate-800 text-center focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Hesap</label>
        <select id="select-account" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-800 focus:outline-none"></select>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Kategori</label>
        <select id="select-category" onchange="updateSubs()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-800 focus:outline-none"></select>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Alt Kategori</label>
        <select id="select-sub" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-800 focus:outline-none"></select>
      </div>

      <div>
        <label class="text-[11px] font-semibold text-slate-500 mb-1 block">Açıklama / Not</label>
        <input id="input-note" type="text" placeholder="İsteğe bağlı not..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-800 focus:outline-none">
      </div>

      <button id="save-btn" onclick="saveRecord()" class="w-full py-2.5 bg-[#2EB85C] hover:bg-[#28A745] active:scale-95 text-white font-semibold rounded-lg text-xs transition shadow-sm cursor-pointer">
        Kaydet
      </button>
    </div>
  </div>

  <script>
    // --- SUPABASE BAĞLANTISI (BİLGİLERİNİZ DOLDURULDU) ---
    const SUPABASE_URL = "https://ljmdrizpzfggmvnricde.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hyJxzInEszidGUHRbPAJhg_apYW0_hu";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CATEGORIES = {
      "Yiyecek & İçecek": { color: "#EA4335", icon: "🍴", subs: ["Yiyecek & İçecek", "Bar, kafe", "Market alışverişi", "Restoran, fast-food"] },
      "Alışveriş": { color: "#0084FF", icon: "🛍️", subs: ["Alışveriş", "Boş zaman", "Eczane, kozmetik", "Elektronik, aksesuar", "Ev, bahçe", "Hediyeler", "Kıyafet & ayakkabı"] },
      "Konut": { color: "#FB8C00", icon: "🏠", subs: ["Konut", "Bakım, onarım", "Kira", "Faturalar"] },
      "Ulaşım": { color: "#78909C", icon: "🚌", subs: ["Ulaşım", "Taksi", "Toplu taşıma", "Uzak mesafe"] },
      "Araç": { color: "#AB47BC", icon: "🚗", subs: ["Araç", "Yakıt", "Bakım", "Otopark"] },
      "Yaşam & Eğlence": { color: "#7CB342", icon: "🎉", subs: ["Eğlence", "Tatil", "Abonelikler"] },
      "Finansal giderler": { color: "#26A69A", icon: "💳", subs: ["Banka ücretleri", "Vergiler", "Kredi faizi"] },
      "Yatırımlar": { color: "#EC407A", icon: "📈", subs: ["Yatırımlar", "Hisse", "Altın/Döviz"] },
      "Gelir": { color: "#FDD835", icon: "💰", subs: ["Maaş, faturalar", "Hediyeler", "Ek Gelir"] },
      "Diğer": { color: "#9E9E9E", icon: "📦", subs: ["Diğer"] }
    };

    let accounts = [];
    let transactions = [];
    let selectedAccountId = null;
    let currentType = 'expense';
    let donutChartInstance = null;
    let trendChartInstance = null;

    async function init() {
      await loadData();
      initCategories();
    }

    async function loadData() {
      const { data: accs, error: accErr } = await supabase.from('accounts').select('*').order('created_at');
      const { data: txs, error: txErr } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });

      if (accErr) {
        document.getElementById('sync-badge').innerText = "Hata!";
        document.getElementById('sync-badge').className = "text-[11px] px-2 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200";
        return;
      }

      accounts = accs || [];
      transactions = txs || [];
      renderAccounts();
      renderDashboard();
    }

    function renderAccounts() {
      const c = document.getElementById('accounts-container');
      c.innerHTML = '';

      accounts.forEach(a => {
        const isSel = selectedAccountId === a.id;
        const val = parseFloat(a.balance);
        const card = document.createElement('div');
        card.onclick = () => { selectedAccountId = selectedAccountId === a.id ? null : a.id; renderAccounts(); renderDashboard(); };
        card.style.backgroundColor = a.color || '#0084FF';
        card.className = `shrink-0 w-[180px] h-[62px] rounded-lg p-2.5 text-white flex flex-col justify-between shadow-xs cursor-pointer transition transform ${isSel ? 'ring-3 ring-slate-800 scale-102' : 'hover:opacity-95'}`;
        card.innerHTML = `
          <div class="flex items-center space-x-1.5 text-xs font-semibold">
            <span>💳</span>
            <span>${a.name}</span>
          </div>
          <div class="text-sm font-bold tracking-tight">
            ${val < 0 ? '-' : ''}₺${Math.abs(val).toLocaleString('tr-TR', { minimumFractionDigits: 2 })}
          </div>
        `;
        c.appendChild(card);
      });

      const selAcc = document.getElementById('select-account');
      selAcc.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    }

    function renderDashboard() {
      const filtered = selectedAccountId ? transactions.filter(t => t.account_id === selectedAccountId) : transactions;

      let netBal = 0;
      let exp = 0;
      let inc = 0;
      const catTotals = {};

      if (selectedAccountId) {
        const a = accounts.find(x => x.id === selectedAccountId);
        netBal = a ? parseFloat(a.balance) : 0;
      } else {
        netBal = accounts.reduce((sum, a) => sum + parseFloat(a.balance), 0);
      }

      filtered.forEach(t => {
        const v = parseFloat(t.amount);
        if (t.type === 'expense') {
          exp += v;
          catTotals[t.category] = (catTotals[t.category] || 0) + v;
        } else {
          inc += v;
        }
      });

      document.getElementById('gauge-bal').innerText = (netBal < 0 ? '-' : '') + '₺' + Math.abs(netBal).toLocaleString('tr-TR');
      document.getElementById('gauge-flow').innerText = '₺' + (inc - exp).toLocaleString('tr-TR');
      document.getElementById('gauge-exp').innerText = '₺' + exp.toLocaleString('tr-TR');

      document.getElementById('trend-total').innerText = (netBal < 0 ? '-' : '') + '₺' + Math.abs(netBal).toLocaleString('tr-TR', { minimumFractionDigits: 2 });
      renderTrendChart();
      renderDonut(catTotals, exp);
      renderTable(filtered);
    }

    function renderDonut(catTotals, exp) {
      const empty = document.getElementById('expense-empty');
      const box = document.getElementById('expense-chart-box');
      const leg = document.getElementById('expense-legend');

      const labels = Object.keys(catTotals);
      const data = Object.values(catTotals);

      if (data.length === 0 || exp === 0) {
        empty.classList.remove('hidden');
        box.classList.add('hidden');
        leg.innerHTML = '';
        return;
      }

      empty.classList.add('hidden');
      box.classList.remove('hidden');

      const colors = labels.map(l => CATEGORIES[l]?.color || '#9E9E9E');

      if (donutChartInstance) donutChartInstance.destroy();
      const ctx = document.getElementById('donutChart').getContext('2d');
      donutChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
        },
        options: { cutout: '68%', responsive: true, plugins: { legend: { display: false } } }
      });

      leg.innerHTML = labels.map((l, i) => `
        <span class="inline-flex items-center gap-1 font-medium">
          <span class="w-2 h-2 rounded-full" style="background-color: ${colors[i]}"></span>
          ${l}
        </span>
      `).join('');
    }

    function renderTrendChart() {
      if (trendChartInstance) trendChartInstance.destroy();
      const ctx = document.getElementById('trendChart').getContext('2d');
      trendChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['1 Nis', '5 Nis', '10 Nis', '15 Nis', '20 Nis', '25 Nis', '30 Nis'],
          datasets: [{
            data: [0, 0, 0, 0, 0, 0, 0],
            borderColor: '#0084FF',
            backgroundColor: 'rgba(0,132,255,0.06)',
            fill: true,
            tension: 0.3,
            borderWidth: 2,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#94A3B8' } },
            y: { grid: { color: '#F1F5F9' }, ticks: { font: { size: 9 }, color: '#94A3B8' } }
          }
        }
      });
    }

    function renderTable(txs) {
      const t = document.getElementById('tx-table');
      t.innerHTML = '';
      if (txs.length === 0) {
        t.innerHTML = '<div class="text-center py-6 text-xs text-slate-400">Henüz kayıt yok.</div>';
        return;
      }
      txs.slice(0, 10).forEach(x => {
        const isExp = x.type === 'expense';
        const cat = CATEGORIES[x.category] || { icon: '📦', color: '#9E9E9E' };
        const row = document.createElement('div');
        row.className = 'py-3 flex items-center justify-between';
        row.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background-color: ${cat.color}15; color: ${cat.color};">
              ${cat.icon}
            </div>
            <div>
              <div class="text-xs font-semibold text-slate-800">${x.sub_category || x.category}</div>
              <div class="text-[11px] text-slate-400">${x.note || x.category}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-bold ${isExp ? 'text-rose-500' : 'text-emerald-500'}">
              ${isExp ? '-' : '+'}₺${parseFloat(x.amount).toLocaleString('tr-TR', { minimumFractionDigits: 2 })}
            </div>
            <button onclick="deleteRecord('${x.id}')" class="text-[10px] text-slate-400 hover:text-rose-500">Sil</button>
          </div>
        `;
        t.appendChild(row);
      });
    }

    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function setType(t) {
      currentType = t;
      const bExp = document.getElementById('btn-exp');
      const bInc = document.getElementById('btn-inc');
      if (t === 'expense') {
        bExp.className = 'py-2 text-xs font-bold rounded-md bg-rose-500 text-white shadow-xs';
        bInc.className = 'py-2 text-xs font-bold rounded-md text-slate-600';
      } else {
        bInc.className = 'py-2 text-xs font-bold rounded-md bg-emerald-500 text-white shadow-xs';
        bExp.className = 'py-2 text-xs font-bold rounded-md text-slate-600';
      }
    }

    function initCategories() {
      const s = document.getElementById('select-category');
      s.innerHTML = Object.keys(CATEGORIES).map(c => `<option value="${c}">${CATEGORIES[c].icon} ${c}</option>`).join('');
      updateSubs();
    }

    function updateSubs() {
      const c = document.getElementById('select-category').value;
      const sub = document.getElementById('select-sub');
      const list = CATEGORIES[c]?.subs || [c];
      sub.innerHTML = list.map(x => `<option value="${x}">${x}</option>`).join('');
    }

    async function saveRecord() {
      const amt = parseFloat(document.getElementById('input-amount').value);
      if (!amt || amt <= 0) return alert('Tutar girin');

      const accId = document.getElementById('select-account').value;
      const cat = document.getElementById('select-category').value;
      const sub = document.getElementById('select-sub').value;
      const note = document.getElementById('input-note').value;

      const btn = document.getElementById('save-btn');
      btn.innerText = 'Kaydediliyor...';
      btn.disabled = true;

      await supabase.from('transactions').insert([{
        account_id: accId,
        type: currentType,
        amount: amt,
        category: cat,
        sub_category: sub,
        note: note
      }]);

      const a = accounts.find(x => x.id === accId);
      if (a) {
        const cur = parseFloat(a.balance);
        const next = currentType === 'expense' ? (cur - amt) : (cur + amt);
        await supabase.from('accounts').update({ balance: next }).eq('id', accId);
      }

      btn.innerText = 'Kaydet';
      btn.disabled = false;
      document.getElementById('input-amount').value = '';
      document.getElementById('input-note').value = '';
      closeModal();
      loadData();
    }

    async function deleteRecord(id) {
      if (confirm('Kayıt silinsin mi?')) {
        await supabase.from('transactions').delete().eq('id', id);
        loadData();
      }
    }

    async function addAccountPrompt() {
      const name = prompt('Yeni hesap adı (Örn: Garanti):');
      if (!name) return;
      const bal = parseFloat(prompt('Başlangıç bakiyesi (Örn: 1000):') || '0');
      await supabase.from('accounts').insert([{ name: name, balance: bal, color: '#3B82F6' }]);
      loadData();
    }

    // Realtime Dinleme
    supabase.channel('wallet-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => loadData())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, () => loadData())
      .subscribe();

    init();
  </script>
</body>
</html>
